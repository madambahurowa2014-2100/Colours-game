<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Pair - Memory Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: url('https://i.pinimg.com/originals/88/25/e6/8825e6471360ae37a43684e6b73f83d3.jpg?nii=t') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden; /* Чтобы не было горизонтальной прокрутки */
            padding: 20px 0;
        }

        .game-wrapper {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 30px;
            max-width: 900px;
            width: 95%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 5px solid #ff69b4;
            text-align: center;
        }

        h1 {
            color: #ff1493;
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .stats {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-weight: bold;
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 колонок для 10 карт */
            gap: 20px;
            perspective: 1000px;
            margin: 0 auto;
        }

        /* Карточка */
        .card {
            background-color: transparent;
            height: 180px; /* Увеличенная высота */
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: pulse 0.6s ease-in-out;
            cursor: default;
        }

        /* Лицевая и обратная стороны */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            user-select: none;
            overflow: hidden;
        }

        /* Рубашка (то, что видим сначала) */
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 4em; /* Огромный вопросительный знак */
            border: 4px solid white;
        }

        /* Лицо (картинка или слово) */
        .card-back {
            background: white;
            transform: rotateY(180deg);
            border: 4px solid #ff69b4;
            flex-direction: column;
            padding: 10px;
        }

        /* Изображение внутри карточки */
        .card-back img {
            width: 90%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        /* Текст внутри карточки */
        .card-back span {
            color: #333;
            font-size: 1.8em; /* Крупный шрифт */
            font-weight: bold;
            text-transform: lowercase;
            line-height: 1.2;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); box-shadow: 0 0 20px gold; border-color: gold; }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Экран победы */
        .win-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s;
            padding: 40px 0;
        }

        .win-screen h2 {
            color: #ffd700;
            font-size: 4em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.8em;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .restart-btn:hover { transform: scale(1.05); }

        .falling-star {
            position: fixed;
            top: -50px;
            font-size: 40px;
            animation: fall linear forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Адаптивность для планшетов и телефонов */
        @media (max-width: 800px) {
            .grid { 
                grid-template-columns: repeat(4, 1fr); /* 4 колонки */
                gap: 15px; 
            }
            .card { height: 140px; }
            .card-front { font-size: 3em; }
            .card-back span { font-size: 1.4em; }
            h1 { font-size: 2em; }
        }

        @media (max-width: 500px) {
            .grid { 
                grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефонах */
                gap: 10px; 
            }
            .card { height: 120px; }
            .card-front { font-size: 2.5em; }
            .card-back span { font-size: 1.2em; }
            h1 { font-size: 1.5em; }
            .stats { font-size: 1.2em; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1> Find the Pair!</h1>
        <div class="stats">
            <span>Moves: <b id="moves">0</b></span>
            <span>Pairs: <b id="pairs">0</b>/5</span>
        </div>

        <div class="grid" id="grid">
            <!-- Карточки генерируются JS -->
        </div>

        <div class="win-screen" id="winScreen">
            <h2> Well done! 🌟</h2>
            <p style="font-size: 1.8em; margin-bottom: 20px; color: #666;">You found all pairs!</p>
            <button class="restart-btn" onclick="initGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        // Данные для игры: Картинка + Слово
        const items = [
            { 
                id: 'treehouse', 
                word: 'tree house', 
                img: 'https://avatars.mds.yandex.net/get-shedevrum/11552302/img_37294dec04a011efb5279608ae710c1d/orig',
                emoji: '' 
            },
            { 
                id: 'bed', 
                word: 'bed', 
                img: 'https://i.pinimg.com/736x/d3/bf/7f/d3bf7fbda6b50c00e345cb513c82a9e6.jpg',
                emoji: '🛏️' 
            },
            { 
                id: 'table', 
                word: 'table', 
                img: 'https://static.vecteezy.com/system/resources/previews/041/458/995/large_2x/wood-round-table-without-legs-on-a-white-background-vector.jpg',
                emoji: '' 
            },
            { 
                id: 'chair', 
                word: 'chair', 
                img: 'https://i.pinimg.com/originals/a7/f0/02/a7f002b585b796919558a0cb5b159ade.jpg?nii=t',
                emoji: '' 
            },
            { 
                id: 'radio', 
                word: 'radio', 
                img: 'https://static.vecteezy.com/system/resources/previews/048/916/319/non_2x/an-old-radio-is-shown-in-a-drawing-vector.jpg',
                emoji: '' 
            }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;
        let audioContext = null;

        function initAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            initAudio();
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            if (type === 'flip') {
                osc.frequency.setValueAtTime(400, audioContext.currentTime);
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                osc.start(); osc.stop(audioContext.currentTime + 0.1);
            } else if (type === 'match') {
                osc.frequency.setValueAtTime(523.25, audioContext.currentTime);
                osc.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.4);
                osc.start(); osc.stop(audioContext.currentTime + 0.4);
            } else if (type === 'win') {
                [523, 659, 783, 1046].forEach((freq, i) => {
                    setTimeout(() => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.connect(g); g.connect(audioContext.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, audioContext.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                        o.start(); o.stop(audioContext.currentTime + 0.3);
                    }, i * 150);
                });
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createCard(item, type) {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.id = item.id;
            
            // Лицевая сторона (рубашка)
            const front = document.createElement('div');
            front.classList.add('card-face', 'card-front');
            front.innerHTML = '?';
            
            // Обратная сторона (контент)
            const back = document.createElement('div');
            back.classList.add('card-face', 'card-back');
            
            if (type === 'image') {
                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.word;
                // Если картинка не грузится, показываем эмодзи
                img.onerror = function() { 
                    this.style.display='none'; 
                    back.innerHTML = `<div style="font-size:4em">${item.emoji}</div>`; 
                };
                back.appendChild(img);
            } else {
                const span = document.createElement('span');
                span.textContent = item.word;
                back.appendChild(span);
            }

            card.appendChild(front);
            card.appendChild(back);
            
            card.addEventListener('click', () => flipCard(card));
            return card;
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card === flippedCards[0]) return; 
            if (card.classList.contains('matched')) return;

            card.classList.add('flipped');
            playSound('flip');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards.forEach(card => {
                card.classList.add('matched');
                card.style.pointerEvents = 'none'; 
            });
            playSound('match');
            matchedPairs++;
            document.getElementById('pairs').textContent = matchedPairs;
            flippedCards = [];
            lockBoard = false;

            if (matchedPairs === items.length) {
                setTimeout(winGame, 800);
            }
        }

        function unflipCards() {
            setTimeout(() => {
                flippedCards.forEach(card => card.classList.remove('flipped'));
                flippedCards = [];
                lockBoard = false;
            }, 1200); // Чуть больше времени, чтобы рассмотреть
        }

        function winGame() {
            playSound('win');
            document.getElementById('grid').style.display = 'none';
            document.querySelector('.stats').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            const winScreen = document.getElementById('winScreen');
            winScreen.style.display = 'flex';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['⭐', '🌟', '✨', '💫', '🎉'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.classList.add('falling-star');
                    el.textContent = colors[Math.floor(Math.random() * colors.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 4000);
                }, i * 80);
            }
        }

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.style.display = 'grid';
            document.querySelector('.stats').style.display = 'flex';
            document.querySelector('h1').style.display = 'block';
            document.getElementById('winScreen').style.display = 'none';
            
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            lockBoard = false;
            document.getElementById('moves').textContent = 0;
            document.getElementById('pairs').textContent = 0;

            // Создаем пары: одна с картинкой, одна со словом
            let deck = [];
            items.forEach(item => {
                deck.push(createCard(item, 'image'));
                deck.push(createCard(item, 'word'));
            });

            shuffle(deck);
            deck.forEach(card => grid.appendChild(card));
        }

        // Запуск при загрузке
        window.onload = initGame;
    </script>
</body>
</html>
